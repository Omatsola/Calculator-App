<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calcu.css">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>
  <main class="calculator" aria-label="Standard Calculator">
    <!-- Top Header & Theme Toggle -->
    <div class="calc-header">
      <span class="brand">CALC</span>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">☀️</button>
    </div>

    <!-- Display Screen -->
    <div class="display" role="region" aria-live="polite">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </div>

    <!-- Keypad Grid -->
    <div class="keypad">
      <button class="btn span-two action" data-action="clear">AC</button>
      <button class="btn action" data-action="delete">DEL</button>
      <button class="btn operator" data-operator="÷">÷</button>

      <button class="btn" data-number="7">7</button>
      <button class="btn" data-number="8">8</button>
      <button class="btn" data-number="9">9</button>
      <button class="btn operator" data-operator="×">×</button>

      <button class="btn" data-number="4">4</button>
      <button class="btn" data-number="5">5</button>
      <button class="btn" data-number="6">6</button>
      <button class="btn operator" data-operator="-">−</button>

      <button class="btn" data-number="1">1</button>
      <button class="btn" data-number="2">2</button>
      <button class="btn" data-number="3">3</button>
      <button class="btn operator" data-operator="+">+</button>

      <button class="btn span-two" data-number="0">0</button>
      <button class="btn" data-number=".">.</button>
      <button class="btn equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="calcu.js"></script>
</body>
</html>
